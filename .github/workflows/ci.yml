name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Validate
        run: make check PYTHON=python PIP="python -m pip"

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Generate synthetic demo model
        run: python -m botchess.demo --output /tmp/botchess-demo.joblib
